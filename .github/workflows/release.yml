name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    name: Build, Sign & Notarize (macOS)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-mac-${{ hashFiles('apps/electron/package.json', 'package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage production app
        run: npm run stage:production

      - name: Package & Sign
        timeout-minutes: 45
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            echo "=== electron-builder attempt $i ==="
            npm exec --workspace=@look/electron electron-builder -- --mac --publish never && break
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: look-macos
          path: release/
          if-no-files-found: error

  release-win:
    name: Build & Package (Windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-win-${{ hashFiles('apps/electron/package.json', 'package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage production app
        run: npm run stage:production

      - name: Package
        timeout-minutes: 45
        run: npm exec --workspace=@look/electron electron-builder -- --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: look-windows
          path: release/
          if-no-files-found: error

  release-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-linux-${{ hashFiles('apps/electron/package.json', 'package-lock.json') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxcb-xv0 \
            libxrender1 libpulse-dev libnss3 libasound2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage production app
        run: npm run stage:production

      - name: Package
        timeout-minutes: 45
        run: npm exec --workspace=@look/electron electron-builder -- --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: look-linux
          path: release/
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [release-mac, release-win, release-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/look-macos/*
            artifacts/look-windows/*
            artifacts/look-linux/*
