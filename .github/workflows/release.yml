name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Notarize
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID Certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$MAC_CERT_P12" | base64 -d > /tmp/cert.p12
          security create-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d system -s build.keychain login.keychain
          security unlock-keychain -p "$MAC_CERT_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S "apple-tool:,apple:,codesign:,productsign:" -s -k "$MAC_CERT_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Build
        run: npm run build

      - name: Package, Sign & Notarize (with retry)
        timeout-minutes: 40
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            echo "=== electron-builder attempt $i ==="
            timeout 900 npx electron-builder --mac --publish never && break
            ec=$?
            if [ $ec -eq 124 ]; then
              echo "Attempt $i timed out (15 min), retrying..."
            else
              echo "Attempt $i failed (exit $ec), retrying in 15s..."
              sleep 15
            fi
          done

      - name: Upload to GitHub Release
        run: npx electron-builder --mac --publish always -p github
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
