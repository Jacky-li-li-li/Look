appId: com.agent-harness.app
productName: Look
electronVersion: 42.5.1

publish:
  provider: github
  owner: Jacky-li-li-li
  repo: Look

directories:
  output: release
  buildResources: build

# CI runner 架构 = 目标架构，无需重编译
npmRebuild: false

asar: true
asarUnpack:
  # Pi SDK 原生模块（pi-coding-agent 内部加载）
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/native/**"
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-darwin-arm64/**"
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-darwin-universal/**"
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-darwin-x64/**"
  # macOS 文件监听原生模块
  - "node_modules/fsevents/**"

files:
  - dist/**/*
  - package.json
  - node_modules/**/*

  # workspace 包：保留编译产物 node_modules/@look/*/dist/，排除源码
  - "!packages/shared/src/**"
  - "!packages/core/src/**"
  - "!packages/shared/node_modules/**"
  - "!packages/core/node_modules/**"

  # 构建工具（运行时不需要）
  - "!node_modules/electron{,mon}*/**"
  - "!node_modules/electron-builder/**"
  - "!node_modules/vite{, plugins*}*/**"
  - "!node_modules/esbuild{, plugin*}*/**"
  - "!node_modules/typescript{, lib*/**}*/**"
  - "!node_modules/@types/**"
  - "!node_modules/@vitejs/**"
  - "!node_modules/@electron{, -builder}/**"
  - "!node_modules/@esbuild/**"
  - "!node_modules/@rollup/**"
  - "!node_modules/concurrently/**"
  - "!node_modules/patch-package/**"
  - "!node_modules/react-scan/**"

  # 测试工具
  - "!node_modules/vitest{, -data-driven}*/**"
  - "!node_modules/happy-dom/**"
  - "!node_modules/jsdom/**"

  # 构建时原生模块（不需要打包到应用中）
  - "!node_modules/lightningcss-darwin-arm64/**"
  - "!node_modules/@tailwindcss/oxide-darwin-arm64/**"
  - "!node_modules/@electron-internal/**"

  # 非 darwin 平台原生模块（macOS 应用不需要）
  - "!node_modules/@mariozechner/clipboard-{linux,win32}*/**"
  - "!node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/native/{linux,win32}/**"
  - "!node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-{linux,win32}*/**"

  # 文档/示例/源码映射
  - "!node_modules/@earendil-works/*/{examples,docs,test,test-fixtures}/**"
  - "!node_modules/**/*.{ts,tsx,map,md,markdown}"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
