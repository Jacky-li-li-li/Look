appId: com.agent-harness.app
productName: Look

publish:
  provider: github
  owner: Jacky-li-li-li
  repo: Look

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  identity: null
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
