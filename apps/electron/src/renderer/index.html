<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; font-src 'self' data:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://*.supabase.co; media-src 'self' data: blob: file:; frame-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
		/>
		<title>Look</title>
		<script vite-ignore src="./theme-bootstrap.js"></script>
		<!-- Critical inline theme: prevents white flash on reload by defining
		     the CSS variable chain before App.css loads asynchronously.
		     Matches BrowserWindow backgroundColor and App.css .tone-dark values.
		     Scoped to neutral boots (`:not([class*="theme-"])`) — themed boots
		     get their background from theme-bootstrap.js's injected style,
		     otherwise these `--background` overrides on #root/.app-shell would
		     hijack the theme palette inside the app tree. -->
		<style>
			:root {
				--ink-0: oklch(0.985 0.002 85);
				--ink-8: oklch(0.09 0.002 85);
			}
			html:not([class*="theme-"]),
			html:not([class*="theme-"]) body,
			html:not([class*="theme-"]) #root,
			html:not([class*="theme-"]) .app-shell {
				--background: var(--ink-8);
				--foreground: var(--ink-0);
				--color-background: var(--background);
				--color-foreground: var(--foreground);
				background-color: var(--background);
				color: var(--foreground);
			}
			html { color-scheme: dark; }
			html.tone-light:not([class*="theme-"]),
			html.tone-light:not([class*="theme-"]) body,
			html.tone-light:not([class*="theme-"]) #root,
			html.tone-light:not([class*="theme-"]) .app-shell {
				--background: var(--ink-0);
				--foreground: var(--ink-8);
				--color-background: var(--background);
				--color-foreground: var(--foreground);
				background-color: var(--background);
				color: var(--foreground);
			}
			html.tone-light { color-scheme: light; }
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./index.tsx"></script>
	</body>
</html>
