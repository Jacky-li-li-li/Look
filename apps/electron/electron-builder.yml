appId: com.agent-harness.app
productName: Look
electronVersion: 42.5.1

publish:
  provider: github
  owner: Jacky-li-li-li
  repo: Look

directories:
  # electron-builder only sees the generated production app, never the full
  # development repository or its root node_modules tree.
  app: .release-staging
  output: release
  buildResources: build

# CI runner 架构 = 目标架构，无需重编译
npmRebuild: false

asar: true

# Run before packaging to clean extended attributes that can break codesign
beforePack: scripts/clean-xattrs.mjs
# Verify resources required during startup exist before signing artifacts.
afterPack: scripts/verify-packaged-app.mjs
# Local notarization activates only when LOOK_NOTARY_PROFILE is set. CI keeps
# using electron-builder's APPLE_* credential integration.
afterSign: scripts/notarize.mjs
asarUnpack:
  # Pi SDK native modules and the current platform clipboard package must stay
  # outside ASAR. staging removes other-platform binaries before this phase.
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@earendil-works/pi-tui/native/**"
  - "node_modules/@earendil-works/pi-coding-agent/node_modules/@mariozechner/clipboard-*/**"
  - "node_modules/@mariozechner/clipboard-*/**"
  - "node_modules/fsevents/**"

extraResources:
  # Startup copies these versioned templates into ~/.look/.
  - from: default-skills
    to: default-skills
    filter:
      - "**/*"
  - from: default-agents
    to: default-agents
    filter:
      - "**/*"

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - "!dist/**/*.d.ts"
  - "!dist/**/*.map"
  - "!dist/.tsbuildinfo"
  - "!node_modules/**/*.{ts,tsx,map,md,markdown}"
  - "!node_modules/@earendil-works/*/{examples,docs,test,test-fixtures}/**"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis

linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
